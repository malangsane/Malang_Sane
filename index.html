<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List (Local Storage)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>To‑Do List</h1>

    <form id="todo-form" class="todo-form" aria-label="Adicionar tarefa">
      <input id="todo-input" type="text" placeholder="Adicione uma nova tarefa e pressione Enter..." autocomplete="off" />
      <button type="submit" id="add-button">Adicionar</button>
    </form>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="active">Ativas</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Limpar concluídas</button>
        <button id="clear-all">Limpar tudo</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="items-left">0 items</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
